name: Windows and accounting checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node desktop/build.mjs
      - run: npx vite build --config vite.desktop.config.ts
      - run: node --import tsx desktop/smoke.mjs
      - run: node --import tsx desktop/ledger-items-smoke.mjs
      - run: node --import tsx desktop/reports-smoke.mjs
      - run: node --import tsx desktop/recovery-smoke.mjs
